[package]
name = "hallmonitor-gpui"
version = "0.1.0"
edition = "2024"
description = "Experimental Hall Monitor window in GPUI"
publish = false

[[bin]]
name = "hallmonitor-gpui"
path = "src/main.rs"

[dependencies]
# runtime_shaders: macOS compiles the Metal shaders at launch, so the
# Command Line Tools are enough (no Xcode, no `metal` compiler).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 16
